services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: smartskill_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartskill_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartskill_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartskill_net

  # ==========================================
  # 2. FastAPI Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartskill_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_2026}@postgres:5432/${POSTGRES_DB:-smartskill_db}
      - SECRET_KEY=${SECRET_KEY:-smartskill-ai-super-secret-production-key-mospi-2026-igot}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_TEMPERATURE=0.0
      - UPLOAD_DIR=/app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartskill_net

  # ==========================================
  # 3. React Frontend Service (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartskill_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartskill_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  smartskill_net:
    driver: bridge
