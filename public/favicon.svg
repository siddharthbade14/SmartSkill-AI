<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06162B"/>
      <stop offset="50%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#113A6E"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="barSaffron" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Outer Hex Shield Outline -->
  <path d="M32 8L52 19V39L32 56L12 39V19L32 8Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2" stroke-linejoin="round" opacity="0.45"/>

  <!-- Statistical Competency Bars -->
  <!-- Bar 1 (Foundation) -->
  <rect x="18" y="36" width="6" height="10" rx="2" fill="url(#barBlue)" opacity="0.9"/>
  <!-- Bar 2 (Intermediate) -->
  <rect x="28" y="29" width="6" height="17" rx="2" fill="url(#barBlue)"/>
  <!-- Bar 3 (Peak / Mastery) -->
  <rect x="38" y="21" width="6" height="25" rx="2" fill="url(#barSaffron)"/>

  <!-- AI Neural Pathways / Growth Line -->
  <path d="M21 33L31 25L41 18L49 11" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Synapse Node Dots -->
  <circle cx="21" cy="33" r="3" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="31" cy="25" r="3" fill="#93C5FD" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="41" cy="18" r="3.2" fill="#FBBF24" stroke="#FFFFFF" stroke-width="1.2"/>

  <!-- Central AI Spark Core -->
  <path d="M32 12L33.5 16.5L38 18L33.5 19.5L32 24L30.5 19.5L26 18L30.5 16.5L32 12Z" fill="#FFFFFF"/>

  <!-- Live Pulse Indicator (Bottom Right) -->
  <circle cx="53" cy="53" r="4.5" fill="#10B981" stroke="#06162B" stroke-width="2"/>
</svg>